plugins {
    id 'com.android.library'
    
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace = 'com.example.csgocaseswatcherapp.data.remote'
    compileSdk = 37

    defaultConfig {
        minSdk = 26

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("consumer-rules.pro")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add("-jvm-default=enable")
    }
}

dependencies {
    implementation project(':core:network')

    implementation project(':feature:start:domain')
    implementation project(':feature:caseoverview:domain')
    implementation project(':feature:caseanalytics:domain')
    implementation project(':feature:portfolio:domain')
    implementation project(':feature:addcase:domain')

    implementation project(':feature:start:data')
    implementation project(':feature:caseoverview:data')
    implementation project(':feature:caseanalytics:data')
    implementation project(':feature:portfolio:data')
    implementation project(':feature:addcase:data')

    implementation 'androidx.core:core-ktx:1.16.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"

    implementation "com.google.dagger:hilt-android:2.59.2"
    ksp "com.google.dagger:hilt-android-compiler:2.59.2"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}