plugins {
    id 'com.android.library'
    
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = 'com.example.csgocaseswatcherapp.api'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("consumer-rules.pro")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add("-jvm-default=enable")
    }
}


dependencies {
    implementation project(':feature:start:data')
    implementation project(':feature:caseoverview:data')
    implementation project(':feature:caseanalytics:data')
    implementation project(':feature:portfolio:data')
    implementation project(':feature:addcase:data')

    implementation 'androidx.core:core-ktx:1.18.0'

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}